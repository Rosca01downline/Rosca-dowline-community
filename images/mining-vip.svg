 <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dffaff"/><stop offset=".45" stop-color="#18bfff"/><stop offset="1" stop-color="#0346b5"/></linearGradient>
 <radialGradient id="fan"><stop stop-color="#8df5ff"/><stop offset=".18" stop-color="#147ed0"/><stop offset=".65" stop-color="#07172d"/><stop offset="1" stop-color="#020916"/></radialGradient>
