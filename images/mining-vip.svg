<style>
@keyframes rgbStroke {
  0%, 29% { stroke:#ff1738; }
  33%, 62% { stroke:#24ff65; }
  66%, 95% { stroke:#ffffff; }
  100% { stroke:#ff1738; }
}
@keyframes rgbBulbColor {
  0%, 29% { stroke:#ff1738; fill:#ff1738; }
  33%, 62% { stroke:#24ff65; fill:#24ff65; }
  66%, 95% { stroke:#ffffff; fill:#ffffff; }
  100% { stroke:#ff1738; fill:#ff1738; }
}
@keyframes rgbStripColor {
  0%, 29% { fill:#ff1738; }
  33%, 62% { fill:#24ff65; }
  66%, 95% { fill:#ffffff; }
  100% { fill:#ff1738; }
}
@keyframes rgbGlow {
  0%, 29% { opacity:1; filter:url(#glowRed); }
  33%, 62% { opacity:1; filter:url(#glowGreen); }
  66%, 95% { opacity:1; filter:url(#glowWhite); }
  100% { opacity:1; filter:url(#glowRed); }
}
@keyframes chase {
  0%, 100% { opacity:1; }
  50% { opacity:.22; }
}
.rgb-edge { fill:none; stroke-width:6; stroke-linecap:round; animation:rgbStroke 2.4s infinite, rgbGlow 2.4s infinite; }
.rgb-edge-inner { fill:none; stroke-width:4; stroke-linecap:round; animation:rgbStroke 2.4s infinite; animation-delay:.35s; }
.rgb-bulb { stroke-width:3; animation:rgbBulbColor 2.4s infinite, rgbGlow 2.4s infinite; }
.rgb-bulb:nth-of-type(2n) { animation-delay:.25s; }
.rgb-bulb:nth-of-type(3n) { animation-delay:.5s; }
.rgb-strip { animation:rgbStripColor 2.4s infinite, chase 1.2s infinite; }
@media (prefers-reduced-motion: reduce) { .rgb-edge,.rgb-edge-inner,.rgb-bulb,.rgb-strip { animation:none; } }
</style>
<defs>
  <filter id="glowRed" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="b"/><feGaussianBlur stdDeviation="4" in="SourceGraphic" result="s"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowGreen" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="b"/><feGaussianBlur stdDeviation="4" in="SourceGraphic" result="s"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="glowWhite" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10" result="b"/><feGaussianBlur stdDeviation="4" in="SourceGraphic" result="s"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
