<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470">
<defs>
 <linearGradient id="case" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dceeff"/><stop offset=".18" stop-color="#365879"/><stop offset=".42" stop-color="#07172d"/><stop offset=".76" stop-color="#1b3555"/><stop offset="1" stop-color="#b7d8f5"/></linearGradient>
